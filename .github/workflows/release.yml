name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Validate tag and build
        shell: bash
        run: |
          version=$(sh run.sh version)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
          sh run.sh build
      - name: Verify packaged audio decoding
        shell: pwsh
        run: |
          $result = Start-Process -FilePath .\dist\Whisper-Desktop.exe -ArgumentList '--smoke-test' -Wait -PassThru
          exit $result.ExitCode
      - name: Generate changelog and release notes
        shell: bash
        run: |
          uv run --locked --no-sync --python 3.13 python scripts/changelog.py \
            --tag "$GITHUB_REF_NAME" --output dist/CHANGELOG.md --release-notes build/release-notes.md
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file build/release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/Whisper-Desktop.exe dist/CHANGELOG.md --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Whisper-Desktop.exe dist/CHANGELOG.md \
              --verify-tag --notes-file build/release-notes.md
          fi
