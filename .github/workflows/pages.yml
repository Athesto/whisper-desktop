name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'assets/whisper.svg'
      - 'assets/LICENSE-Material-Icons'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Copy the project icon
        run: cp assets/whisper.svg assets/LICENSE-Material-Icons pages/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
