<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whisper · Subtítulos</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 "Segoe UI", sans-serif; color: #f1f2f6; background: #111318; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 730px; padding: 42px 30px; margin: auto; }
    header { margin-bottom: 30px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; }
    .brand img { width: 28px; height: 28px; }
    .brand strong { color: #b6b0ff; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -.045em; line-height: 1.1; margin: 8px 0 12px; }
    p { margin: 0; color: #b2b6c5; }
    .panel { background: #1a1d25; border: 1px solid #303442; border-radius: 18px; padding: 24px; }
    .file, .actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .file { padding-bottom: 22px; border-bottom: 1px solid #303442; }
    #filename { display: block; overflow-wrap: anywhere; max-width: 360px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
    label { display: grid; gap: 6px; font-weight: 600; }
    select, button { font: inherit; border: 1px solid #424757; border-radius: 9px; padding: 9px 13px; }
    select { width: 100%; background: #15171e; }
    button { background: #252936; font-weight: 600; cursor: pointer; }
    button.primary { background: #bdb7ff; color: #15122c; border-color: transparent; }
    button:hover:enabled { filter: brightness(1.13); }
    button:disabled, select:disabled { opacity: .48; cursor: default; }
    :focus-visible { outline: 2px solid #d5d1ff; outline-offset: 3px; }
    .status { margin-top: 20px; }
    progress { width: 100%; accent-color: #bdb7ff; height: 8px; display: block; margin-bottom: 8px; }
    [hidden] { display: none; }
    #status { overflow-wrap: anywhere; }
    #status[data-error="true"] { color: #ffb4ae; }
    footer { margin-top: 16px; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="assets/whisper.svg" alt=""><strong>Whisper</strong></div>
      <h1>Subtítulos para tus videos</h1>
      <p>Abre un video, transcribe su audio y guarda los subtítulos en formato SRT.</p>
    </header>
    <section class="panel" aria-label="Transcripción">
      <div class="file">
        <div><strong>Video</strong><p id="filename">Ningún archivo seleccionado</p></div>
        <button id="choose" disabled>Elegir video</button>
      </div>
      <div class="fields">
        <label>Idioma del audio
          <select id="language">
            <option value="auto">Detectar automáticamente</option>
            <option value="es">Español</option>
            <option value="en">Inglés</option>
            <option value="pt">Portugués</option>
            <option value="fr">Francés</option>
          </select>
        </label>
        <label>Modelo de Whisper
          <select id="model">
            <option value="tiny">Tiny · rápido</option>
            <option value="base" selected>Base · equilibrado</option>
            <option value="small">Small · más preciso</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="start" disabled>Transcribir</button>
        <button id="save" disabled>Exportar SRT</button>
      </div>
      <div class="status">
        <progress id="progress" max="100" aria-label="Progreso de transcripción" hidden></progress>
        <p id="status" role="status">Conectando con la aplicación…</p>
      </div>
    </section>
    <footer><p>El audio se procesa en tu equipo. El primer uso de cada modelo requiere internet para descargarlo.</p></footer>
  </main>
  <script src="ui.js"></script>
</body>
</html>
